name: Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      force:
        description: 'Force release even if tag already exists'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  APP_NAME: panelneko-reader

jobs:
  prepare-version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      skip: ${{ steps.version.outputs.skip }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve release version
        id: version
        shell: bash
        env:
          FORCE_RELEASE: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.force || 'false' }}
        run: |
          set -euo pipefail
          
          # 1. 手动推送 tag 触发（例如本地执行 git tag v1.0.0 && git push origin v1.0.0）
          if [[ "${GITHUB_REF_TYPE:-}" == "tag" && "${GITHUB_REF_NAME:-}" == v* ]]; then
            echo "由手动 Tag 触发: ${GITHUB_REF_NAME}"
            version="${GITHUB_REF_NAME#v}"
            if ! grep -Eq "^##[[:space:]]+v?${version}" CHANGELOG.md; then
              echo "错误: CHANGELOG.md 中未找到版本 ${version} 的更新记录，取消发版流程。" >&2
              exit 1
            fi
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "version=${version}" >> "$GITHUB_OUTPUT"
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          
          # 2. main 分支推送或手动工作流调度触发
          git fetch --tags --force
          
          # 从 CHANGELOG.md 首个二级标题行提取版本号（支持 '## v0.12.0' 或 '## 0.12.0'）
          latest_changelog_version="$(grep -E '^##[[:space:]]+v?[0-9]+\.[0-9]+\.[0-9]+' CHANGELOG.md | head -n 1 | sed -E 's/^##[[:space:]]+v?//; s/[[:space:]].*$//')"
          
          if [[ -z "$latest_changelog_version" ]]; then
            echo "CHANGELOG.md 中未解析到有效的版本号（格式需形如 '## vX.Y.Z'），跳过发版流程。"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          
          tag="v${latest_changelog_version}"
          version="${latest_changelog_version}"
          
          # 检查标签是否已经在远端或本地存在
          tag_exists="false"
          if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null 2>&1 || git ls-remote --tags origin "refs/tags/${tag}" | grep -q .; then
            tag_exists="true"
          fi
          
          if [[ "$tag_exists" == "true" && "${FORCE_RELEASE}" != "true" ]]; then
            echo "CHANGELOG.md 中的最新版本 ${tag} 已被发布过，当前提交未声明新版本，跳过发版流程。"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          
          # 若标签不存在，由 GitHub 机器人创建并推送到远端仓库
          if [[ "$tag_exists" != "true" ]]; then
            echo "检测到 CHANGELOG.md 声明了未发布的新版本: ${tag}，开始创建标签并触发发版流程..."
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag "$tag"
            git push origin "$tag"
          else
            echo "版本 ${tag} 已存在，但检测到手动强制发版 (FORCE_RELEASE=true)，继续执行构建与发布..."
          fi
          
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare-version
    if: needs.prepare-version.outputs.skip != 'true'
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-amd64
            os: ubuntu-latest
            arch: amd64
            archive: panelneko-reader-linux-amd64.tar.gz
          - name: macos-amd64
            os: macos-latest
            arch: amd64
            archive: panelneko-reader-macos-amd64.zip
          - name: macos-arm64
            os: macos-latest
            arch: arm64
            archive: panelneko-reader-macos-arm64.zip
          - name: windows-amd64
            os: windows-latest
            arch: amd64
            archive: panelneko-reader-windows-amd64.zip

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare-version.outputs.tag }}

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Add Windows C compiler to PATH
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          "C:\msys64\mingw64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Update version from Git tag
        run: bun build/update-version.js ${{ needs.prepare-version.outputs.tag }}

      - name: Install frontend dependencies
        working-directory: frontend
        run: bun install --frozen-lockfile

      - name: Install Wails CLI
        shell: bash
        run: |
          WAILS_VERSION="$(go list -m -f '{{.Version}}' github.com/wailsapp/wails/v3)"
          go install "github.com/wailsapp/wails/v3/cmd/wails3@${WAILS_VERSION}"

      - name: Build application (Linux)
        if: runner.os == 'Linux'
        run: wails3 task linux:build ARCH=${{ matrix.arch }}

      - name: Build application (macOS)
        if: runner.os == 'macOS'
        run: wails3 task darwin:package ARCH=${{ matrix.arch }}

      - name: Build application (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: wails3 task windows:build ARCH=${{ matrix.arch }}

      - name: Package Linux artifact
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist
          tar -C build/bin -czf dist/${{ matrix.archive }} ${{ env.APP_NAME }}

      - name: Package macOS artifact
        if: runner.os == 'macOS'
        run: |
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent build/bin/${{ env.APP_NAME }}.app dist/${{ matrix.archive }}

      - name: Package Windows artifact
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist
          Compress-Archive -Path "build/bin/${{ env.APP_NAME }}.exe" -DestinationPath "dist/${{ matrix.archive }}" -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}
          path: dist/${{ matrix.archive }}
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [prepare-version, build]
    if: needs.prepare-version.outputs.skip != 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare-version.outputs.tag }}

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Generate release notes
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          bun build/generate-release-notes.ts "${{ needs.prepare-version.outputs.tag }}" release-notes.md

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ needs.prepare-version.outputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          if gh release view "$TAG_NAME" --repo "$REPO" >/dev/null 2>&1; then
            gh release edit "$TAG_NAME" --repo "$REPO" --notes-file release-notes.md
            gh release upload "$TAG_NAME" release-assets/* --repo "$REPO" --clobber
          else
            gh release create "$TAG_NAME" release-assets/* \
              --repo "$REPO" \
              --title "$TAG_NAME" \
              --notes-file release-notes.md \
              --generate-notes
          fi

  sync-homebrew:
    name: Sync Homebrew Cask
    runs-on: ubuntu-latest
    needs: [prepare-version, publish]
    if: needs.prepare-version.outputs.skip != 'true'
    steps:
      - name: Fetch SHA256 from release assets
        env:
          VERSION: ${{ needs.prepare-version.outputs.version }}
          TAG: ${{ needs.prepare-version.outputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          
          ARM_URL="https://github.com/${REPO}/releases/download/${TAG}/panelneko-reader-macos-arm64.zip"
          INTEL_URL="https://github.com/${REPO}/releases/download/${TAG}/panelneko-reader-macos-amd64.zip"
          
          echo "Waiting for assets to be available online..."
          sleep 15
          
          echo "Fetching SHA256..."
          ARM_SHA=$(curl -sL "$ARM_URL" | shasum -a 256 | awk '{print $1}')
          INTEL_SHA=$(curl -sL "$INTEL_URL" | shasum -a 256 | awk '{print $1}')
          
          echo "arm_sha=${ARM_SHA}" >> "$GITHUB_ENV"
          echo "intel_sha=${INTEL_SHA}" >> "$GITHUB_ENV"
          
      - name: Update Homebrew Cask (Personal Tap)
        env:
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
          VERSION: ${{ needs.prepare-version.outputs.version }}
          TAG: ${{ needs.prepare-version.outputs.tag }}
        run: |
          set -euo pipefail
          
          # Clone the external tap repository
          git clone "https://x-access-token:${PAT_TOKEN}@github.com/SakagamiJun/homebrew-tap.git" /tmp/homebrew-tap
          cd /tmp/homebrew-tap
          
          CASK_FILE="Casks/panelneko.rb"
          
          if [ ! -f "$CASK_FILE" ]; then
            echo "Cask file $CASK_FILE not found, skipping sync."
            exit 0
          fi
          
          sed -i -e "s/version \".*\"/version \"${VERSION}\"/" $CASK_FILE
          sed -i -e "/on_arm do/,/end/ s/sha256 \".*\"/sha256 \"${arm_sha}\"/" $CASK_FILE
          sed -i -e "/on_intel do/,/end/ s/sha256 \".*\"/sha256 \"${intel_sha}\"/" $CASK_FILE
          
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$CASK_FILE"
          
          if git diff --staged --quiet; then
            echo "No changes to Cask, skipping commit."
            exit 0
          fi
          
          git commit -m "chore(release): update panelneko cask to ${TAG}"
          git push origin main
